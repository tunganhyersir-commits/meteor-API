pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'fabric-loom') useModule("net.fabricmc:fabric-loom:${requested.version}")
        }
    }
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}
rootProject.name = 'meteor-lib-api'
include 'foundation', 'adapter', 'example-addon'
// The full source runtime is deliberately a separate build, with its own dependencies.
