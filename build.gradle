plugins { id 'base' }
allprojects {
    group = 'dev.meteorapi'
    version = '0.1.2-beta'
    repositories {
        maven { url = rootProject.uri("libs/maven") }
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
        maven { url = 'https://maven.meteordev.org/releases' }
    }
}
